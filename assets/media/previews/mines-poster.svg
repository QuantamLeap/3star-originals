<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual Mines preview poster</title><desc id="desc">A grid of concealed tiles with several green gem reveals.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#12482b"/><stop offset="1" stop-color="#10080b"/></radialGradient><pattern id="tiles" width="86" height="86" patternUnits="userSpaceOnUse"><rect width="72" height="72" x="7" y="7" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".13"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="960" height="600" fill="url(#bg)"/><rect x="265" y="65" width="430" height="430" fill="url(#tiles)"/><g fill="#9fffc3" font-family="sans-serif" font-size="36" text-anchor="middle" filter="url(#glow)"><text x="394" y="207">◆</text><text x="566" y="293">◆</text><text x="480" y="379">◆</text><text x="652" y="465">◆</text></g>
